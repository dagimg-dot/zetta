<!doctype html>
<!-- The share card, rendered to public/og.png by scripts/og.ts at 1200x630. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Lexend;
				src: url(../node_modules/@fontsource-variable/lexend/files/lexend-latin-wght-normal.woff2) format("woff2");
				font-weight: 100 900;
			}
			@font-face {
				font-family: Serif;
				src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) format("woff2");
				font-style: italic;
			}
			@font-face {
				font-family: Code;
				src: url(../node_modules/@fontsource-variable/source-code-pro/files/source-code-pro-latin-wght-normal.woff2) format("woff2");
				font-weight: 200 900;
			}

			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}

			body {
				position: relative;
				background: oklch(0.135 0.004 50);
				color: oklch(0.965 0.004 60);
				font-family: Lexend, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			.grid {
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(to right, oklch(1 0 0 / 0.06) 1px, transparent 1px),
					linear-gradient(to bottom, oklch(1 0 0 / 0.06) 1px, transparent 1px);
				background-size: 48px 48px;
				mask-image: radial-gradient(ellipse 60% 70% at 20% 30%, #000 10%, transparent 80%);
			}

			.glow {
				position: absolute;
				right: -180px;
				bottom: -260px;
				width: 900px;
				height: 600px;
				background: radial-gradient(closest-side, oklch(0.66 0.2 42 / 0.5), transparent 70%);
				filter: blur(30px);
			}

			.text {
				position: absolute;
				left: 72px;
				top: 64px;
				width: 640px;
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 14px;
				font-size: 30px;
				font-weight: 500;
				letter-spacing: -0.03em;
			}

			h1 {
				margin: 52px 0 0;
				font-size: 76px;
				font-weight: 500;
				line-height: 1;
				letter-spacing: -0.045em;
			}

			.serif {
				font-family: Serif, serif;
				font-style: italic;
				font-weight: 400;
				letter-spacing: -0.02em;
				background: linear-gradient(100deg, #fdba74 0%, #fb923c 40%, #ea580c 100%);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				padding-right: 6px;
			}

			p {
				margin: 30px 0 0;
				font-size: 26px;
				font-weight: 300;
				line-height: 1.4;
				color: oklch(0.78 0.008 55);
			}

			.chips {
				position: absolute;
				left: 72px;
				bottom: 60px;
				display: flex;
				gap: 10px;
			}

			.chips span {
				padding: 8px 16px;
				border-radius: 999px;
				background: oklch(1 0 0 / 0.06);
				box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.12);
				font-family: Code, monospace;
				font-size: 19px;
				color: oklch(0.85 0.008 55);
			}

			.chips span:first-child {
				color: #fb923c;
			}

			.shot {
				position: absolute;
				left: 690px;
				top: 150px;
				width: 900px;
				padding: 7px;
				border-radius: 22px;
				background: linear-gradient(180deg, oklch(1 0 0 / 0.1), oklch(1 0 0 / 0.04));
				box-shadow:
					inset 0 0 0 1px oklch(1 0 0 / 0.12),
					0 40px 100px -20px oklch(0 0 0 / 0.8);
				transform: perspective(1800px) rotateY(-14deg) rotateX(4deg);
				transform-origin: 0 50%;
			}

			.shot img {
				display: block;
				width: 100%;
				border-radius: 15px;
			}
		</style>
	</head>
	<body>
		<div class="grid"></div>
		<div class="glow"></div>
		<div class="shot"><img src="../src/assets/postgres-light.png" alt="" /></div>
		<div class="text">
			<div class="brand">
				<img src="../public/favicon.svg" width="48" height="48" alt="" />
				zetta
			</div>
			<h1>Your database,<br />in a <span class="serif">browser tab.</span></h1>
			<p>Browse and query Postgres and SQLite in your browser, or script it from the shell.</p>
		</div>
		<div class="chips">
			<span>one binary &lt; 3 MB</span>
			<span>docker run</span>
			<span>MIT</span>
		</div>
	</body>
</html>
