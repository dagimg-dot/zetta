<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zetta</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --line: #e7e5e4; --text: #1c1917; --muted: #78716c;
    --accent: #4f46e5; --accent-bg: #eef2ff; --hover: #f5f5f4; --err: #b91c1c; --null: #a8a29e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1b1b1a; --line: #2b2a28; --text: #e7e5e4; --muted: #8b8680;
      --accent: #818cf8; --accent-bg: #23233a; --hover: #232321; --err: #f87171; --null: #5f5b57;
    }
  }
  :root { --thumb: #d6d3d1; }
  @media (prefers-color-scheme: dark) { :root { --thumb: #3d3a37; } }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--thumb); border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: content-box; }
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 260px 1fr; }
  .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  aside header b { font-size: 14px; letter-spacing: .2px; }
  input, textarea, button { font: inherit; color: inherit; }
  input[type=search], input[type=text] { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  #tree { overflow: auto; padding: 6px; flex: 1; }
  .schema { margin: 2px 0; }
  .schema > summary { cursor: pointer; padding: 4px 6px; border-radius: 5px; color: var(--muted); font-weight: 600; list-style: none; user-select: none; }
  .schema > summary::before { content: "▸"; display: inline-block; width: 14px; }
  .schema[open] > summary::before { content: "▾"; }
  .schema > summary:hover { background: var(--hover); }
  .count { float: right; font-weight: 400; font-size: 11px; }
  .tbl { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px 3px 20px; border-radius: 5px; cursor: pointer; }
  .tbl:hover { background: var(--hover); }
  .tbl.active { background: var(--accent-bg); color: var(--accent); }
  .kind { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  .rows { margin-left: auto; font-size: 11px; color: var(--muted); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { padding: 7px 12px; border: 0; background: none; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .bar { display: flex; gap: 8px; padding: 10px 12px; align-items: center; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar .grow { flex: 1; }
  .bar .ord { width: 180px; }
  button.btn { padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; }
  button.btn:hover { background: var(--hover); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .4; cursor: default; }
  textarea { width: 100%; min-height: 130px; resize: vertical; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--panel); outline: none; tab-size: 2; }
  .grid { flex: 1; overflow: auto; min-height: 0; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; padding: 0; border-bottom: 1px solid var(--line); font-weight: 600; white-space: nowrap; z-index: 1; }
  .th { display: flex; align-items: center; gap: 2px; padding: 5px 6px 5px 12px; }
  .th .name { cursor: pointer; overflow: hidden; text-overflow: ellipsis; max-width: 320px; margin-right: 4px; }
  .th .name:hover { color: var(--accent); }
  .ico { display: inline-flex; border: 0; background: none; padding: 3px; border-radius: 4px; color: var(--muted); cursor: pointer; opacity: .5; }
  .ico:hover { background: var(--hover); color: var(--text); opacity: 1; }
  .ico.on { color: var(--accent); opacity: 1; }
  .ico.fold { opacity: 0; }
  th:hover .ico.fold { opacity: .7; }
  th:hover .ico.fold:hover { opacity: 1; }
  th.collapsed, td.collapsed { width: 34px; min-width: 34px; max-width: 34px; }
  th.collapsed .th { justify-content: center; padding: 5px 0; }
  th.collapsed .ico.fold { opacity: .9; }
  td.collapsed { padding: 0; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--hover) 4px 5px); }
  th.rn { padding: 6px 12px; }
  td { padding: 5px 12px; border-bottom: 1px solid var(--line); max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:hover td { background: var(--hover); }
  td.null { color: var(--null); font-style: italic; }
  td.rn, th.rn { color: var(--muted); text-align: right; background: var(--panel); position: sticky; left: 0; cursor: default; }
  .status { padding: 6px 12px; border-top: 1px solid var(--line); color: var(--muted); background: var(--panel); display: flex; gap: 12px; align-items: center; }
  .status .err { color: var(--err); white-space: pre-wrap; }
  .empty { margin: auto; color: var(--muted); padding: 40px; text-align: center; }
  .spacer { flex: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<aside>
  <header><b>zetta</b><span class="spacer"></span><button class="btn" id="refresh" title="Reload schemas">↻</button></header>
  <div style="padding:8px"><input type="search" id="find" placeholder="Filter tables…  ( / )" autocomplete="off"></div>
  <div id="tree"></div>
</aside>
<main>
  <div class="tabs">
    <button class="tab on" data-tab="data">Data</button>
    <button class="tab" data-tab="sql">SQL</button>
  </div>

  <section id="data" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="bar">
      <input type="text" class="grow mono" id="filter" placeholder="WHERE …   e.g.  id > 100 and email like '%@x.io'" autocomplete="off" spellcheck="false">
      <input type="text" class="ord mono" id="order" placeholder="ORDER BY …" autocomplete="off" spellcheck="false">
      <button class="btn primary" id="apply">Apply</button>
    </div>
    <div class="grid" id="dataGrid"><div class="empty">Pick a table on the left.</div></div>
    <div class="status">
      <span id="dataInfo"></span><span class="spacer"></span>
      <button class="btn" id="dataHidden" hidden></button>
      <button class="btn" id="prev" disabled>← Prev</button>
      <button class="btn" id="next" disabled>Next →</button>
    </div>
  </section>

  <section id="sql" style="display:none;flex-direction:column;flex:1;min-height:0">
    <textarea class="mono" id="sqlText" spellcheck="false" placeholder="select * from …     (Ctrl+Enter to run)"></textarea>
    <div class="bar"><button class="btn primary" id="run">Run  ⌃↵</button><span id="sqlInfo" style="color:var(--muted)"></span><span class="spacer"></span><button class="btn" id="sqlHidden" hidden></button></div>
    <div class="grid" id="sqlGrid"></div>
  </section>
</main>

<script>
const PAGE = 100;
const $ = (s) => document.querySelector(s);
const state = { schema: null, table: null, offset: 0, tables: [], hidden: new Set() };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}

// Static, trusted SVG paths only (never built from data).
const ICONS = {
  sort: '<path d="M3.5 4.5 6 2l2.5 2.5M3.5 7.5 6 10l2.5-2.5"/>',
  asc: '<path d="M6 10V2M3 5l3-3 3 3"/>',
  desc: '<path d="M6 2v8M3 7l3 3 3-3"/>',
  fold: '<path d="M2 3l2.5 3L2 9M10 3 7.5 6 10 9"/>',
  unfold: '<path d="M4.5 3 2 6l2.5 3M7.5 3 10 6 7.5 9"/>',
};

function iconBtn(name, cls, title, onclick) {
  const b = el('button', { class: 'ico ' + cls, title });
  b.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
  b.onclick = (e) => { e.stopPropagation(); onclick(); };
  return b;
}

/* Sort state lives in the ORDER BY box: it is active only for a plain `"col" [asc|desc]`. */
function currentSort() {
  const m = /^"((?:[^"]|"")+)"(?:\s+(asc|desc))?\s*$/i.exec($('#order').value.trim());
  return m ? { col: m[1].replaceAll('""', '"'), dir: (m[2] || 'asc').toLowerCase() } : null;
}

function cycleSort(col) {
  const cur = currentSort();
  const q = '"' + col.replaceAll('"', '""') + '"';
  $('#order').value = !cur || cur.col !== col ? q + ' asc' : cur.dir === 'asc' ? q + ' desc' : '';
  state.offset = 0; loadTable();
}

/* hidden: Set of column indexes the user collapsed. badge: button that restores them. */
function renderGrid(host, res, { sortable = false, offset = 0, hidden = new Set(), badge = null } = {}) {
  const opts = { sortable, offset, hidden, badge };
  const sx = host.scrollLeft, sy = host.scrollTop;
  host.replaceChildren();
  if (badge) badge.hidden = true;
  if (!res.columns.length) { host.append(el('div', { class: 'empty' }, res.command)); return; }

  const redraw = () => renderGrid(host, res, opts);
  const sort = sortable ? currentSort() : null;
  const head = el('tr', {}, el('th', { class: 'rn' }, '#'));
  res.columns.forEach((c, i) => {
    const off = hidden.has(i);
    const toggle = () => { off ? hidden.delete(i) : hidden.add(i); redraw(); };
    const box = el('div', { class: 'th' });
    if (off) {
      box.append(iconBtn('unfold', 'fold', `Expand ${c}`, toggle));
    } else {
      const name = el('span', { class: 'name', title: c }, c);
      box.append(name);
      if (sortable) {
        const on = sort && sort.col === c;
        name.onclick = () => cycleSort(c);
        box.append(iconBtn(on ? sort.dir : 'sort', on ? 'on' : '', on ? `Sorted ${sort.dir}: click to change` : 'Sort', () => cycleSort(c)));
      }
      box.append(iconBtn('fold', 'fold', `Collapse ${c}`, toggle));
    }
    head.append(el('th', off ? { class: 'collapsed', title: c } : {}, box));
  });

  const body = document.createDocumentFragment();
  res.rows.forEach((row, r) => {
    const tr = el('tr', {}, el('td', { class: 'rn' }, String(offset + r + 1)));
    row.forEach((v, i) => {
      if (hidden.has(i)) { tr.append(el('td', { class: 'collapsed' })); return; }
      tr.append(el('td', v === null ? { class: 'null' } : { title: v.length > 60 ? v : '' }, v === null ? 'NULL' : v));
    });
    body.append(tr);
  });
  host.append(el('table', { class: 'mono' }, el('thead', {}, head), el('tbody', {}, body)));
  host.scrollLeft = sx; host.scrollTop = sy;

  if (badge && hidden.size) {
    badge.hidden = false;
    badge.textContent = `Show ${hidden.size} hidden column${hidden.size > 1 ? 's' : ''}`;
    badge.onclick = () => { hidden.clear(); redraw(); };
  }
}

/* ---- schema tree ---- */
async function loadSchemas() {
  const res = await api('/api/schemas');
  const by = new Map();
  for (const [schema, name, kind, rows] of res.rows) {
    if (!by.has(schema)) by.set(schema, []);
    if (name) by.get(schema).push({ name, kind, rows: Number(rows) });
  }
  state.tables = [...by].map(([schema, tables]) => ({ schema, tables }));
  renderTree();
}

function renderTree() {
  const q = $('#find').value.trim().toLowerCase();
  const tree = $('#tree');
  tree.replaceChildren();
  for (const { schema, tables } of state.tables) {
    const shown = tables.filter((t) => !q || t.name.toLowerCase().includes(q) || schema.toLowerCase().includes(q));
    if (q && !shown.length) continue;
    const d = el('details', { class: 'schema' }, el('summary', {}, schema, el('span', { class: 'count' }, String(shown.length))));
    if (q || schema === state.schema || schema === 'public') d.open = true;
    for (const t of shown) {
      const row = el('div', { class: 'tbl' + (schema === state.schema && t.name === state.table ? ' active' : '') }, t.name);
      if (t.kind !== 'r' && t.kind !== 'p') row.append(el('span', { class: 'kind' }, { v: 'view', m: 'mat', f: 'foreign' }[t.kind] || t.kind));
      if (t.rows >= 0) row.append(el('span', { class: 'rows' }, '~' + t.rows.toLocaleString()));
      row.onclick = () => openTable(schema, t.name);
      d.append(row);
    }
    tree.append(d);
  }
  if (!tree.children.length) tree.append(el('div', { class: 'empty' }, 'No matches'));
}

/* ---- table view ---- */
function openTable(schema, table) {
  Object.assign(state, { schema, table, offset: 0, hidden: new Set() });
  $('#filter').value = ''; $('#order').value = '';
  setTab('data'); renderTree(); loadTable();
}

async function loadTable() {
  if (!state.table) return;
  const p = new URLSearchParams({ schema: state.schema, table: state.table, limit: PAGE, offset: state.offset, filter: $('#filter').value, order: $('#order').value });
  const info = $('#dataInfo');
  info.className = ''; info.textContent = 'Loading…';
  try {
    const res = await api('/api/table?' + p);
    renderGrid($('#dataGrid'), res, { sortable: true, offset: state.offset, hidden: state.hidden, badge: $('#dataHidden') });
    const from = res.rowCount ? state.offset + 1 : 0;
    info.textContent = `${state.schema}.${state.table} — rows ${from}–${state.offset + res.rowCount}`;
    $('#prev').disabled = state.offset === 0;
    $('#next').disabled = res.rowCount < PAGE;
  } catch (e) {
    info.className = 'err'; info.textContent = e.message;
  }
}

/* ---- SQL view ---- */
async function runSql() {
  const sql = $('#sqlText').value.trim();
  if (!sql) return;
  const info = $('#sqlInfo');
  info.style.color = 'var(--muted)'; info.textContent = 'Running…';
  const t0 = performance.now();
  try {
    const res = await api('/api/query', { method: 'POST', body: sql });
    renderGrid($('#sqlGrid'), res, { hidden: new Set(), badge: $('#sqlHidden') });
    const ms = Math.round(performance.now() - t0);
    info.textContent = `${res.command} · ${res.rowCount.toLocaleString()} rows${res.truncated ? ' (showing first 5,000)' : ''} · ${ms} ms`;
  } catch (e) {
    info.style.color = 'var(--err)'; info.textContent = e.message;
  }
}

function setTab(name) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === name));
  $('#data').style.display = name === 'data' ? 'flex' : 'none';
  $('#sql').style.display = name === 'sql' ? 'flex' : 'none';
  if (name === 'sql') $('#sqlText').focus();
}

document.querySelectorAll('.tab').forEach((t) => t.onclick = () => setTab(t.dataset.tab));
$('#find').oninput = renderTree;
$('#refresh').onclick = () => loadSchemas().catch(alert);
$('#apply').onclick = () => { state.offset = 0; loadTable(); };
$('#filter').onkeydown = $('#order').onkeydown = (e) => { if (e.key === 'Enter') $('#apply').click(); };
$('#prev').onclick = () => { state.offset = Math.max(0, state.offset - PAGE); loadTable(); };
$('#next').onclick = () => { state.offset += PAGE; loadTable(); };
$('#run').onclick = runSql;
$('#sqlText').onkeydown = (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runSql(); }
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
};
addEventListener('keydown', (e) => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#find').focus(); }
});

loadSchemas().catch((e) => $('#tree').append(el('div', { class: 'empty' }, e.message)));
</script>
</body>
</html>
