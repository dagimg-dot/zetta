# tryzetta.netlify.app takes manual deploys only: Netlify has no Zig, which the demo's zetta.wasm
# needs, so `bun run deploy` in landing/ builds here and uploads landing/dist. Git builds are off.
[build]
  publish = "landing/dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

# Astro fingerprints these file names, so they can be cached for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Not fingerprinted, but rarely changed: a day in caches, then revalidate.
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# For language models; see https://llmstxt.org.
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"
