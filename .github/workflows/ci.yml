name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  BUN_VERSION: 1.4.0

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            web/dist/index.html.gz
            web/dist/csp.txt
          if-no-files-found: error
          retention-days: 1

  zig:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZETTA_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
      - run: zig build check
      - run: zig build test
      - run: zig build test-oracle -Dpg-oracle=true

  image:
    needs: [web, zig]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME && format('docker.io/{0}/zetta', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha
            type=ref,event=pr

      - uses: docker/setup-buildx-action@v4

      - name: Build for the runner and smoke-test it
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zetta:ci
          build-args: ZETTA_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm zetta:ci --version

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build for amd64 and arm64, and push outside pull requests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ZETTA_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: [web, zig]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Cross-compile and package every platform
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          mkdir -p pkg dist
          for spec in \
            x86_64-linux-musl:linux-x86_64 \
            aarch64-linux-musl:linux-aarch64 \
            aarch64-macos:macos-aarch64 \
            x86_64-windows:windows-x86_64 \
            aarch64-windows:windows-aarch64
          do
            target="${spec%%:*}" name="${spec#*:}" pkg="zetta-$version-${spec#*:}"
            zig build -Doptimize=ReleaseSafe -Dtarget="$target" -Dcpu=baseline -Dui=prebuilt \
              -Dcommit="${GITHUB_SHA::7}" --prefix "out/$name"
            mkdir "pkg/$pkg"
            cp out/"$name"/bin/* LICENSE README.md "pkg/$pkg/"
            case "$name" in
              windows-*) (cd pkg && zip -qr "../dist/$pkg.zip" "$pkg") ;;
              *) tar -czf "dist/$pkg.tar.gz" -C pkg "$pkg" ;;
            esac
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-aarch64, runner: macos-latest }
          - { name: windows-x86_64, runner: windows-latest }
          - { name: windows-aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Unpack the archive and run it on its own platform
        working-directory: dist
        run: |
          archive=$(ls zetta-*-${{ matrix.name }}.*)
          dir="${archive%.tar.gz}" dir="${dir%.zip}"
          case "$archive" in
            *.zip) pwsh -NoProfile -Command "Expand-Archive -Path '$archive' -DestinationPath ." ;;
            *) tar -xzf "$archive" ;;
          esac
          bin="$dir/zetta"
          if [[ -f "$bin.exe" ]]; then bin="$bin.exe"; fi
          "$bin" --version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            "$bin" --version | grep -q "^zetta ${GITHUB_REF_NAME#v} " \
              || { echo "tag $GITHUB_REF_NAME does not match the version in build.zig.zon" >&2; exit 1; }
          fi
          : > smoke.db
          "$bin" query smoke.db "create table t (x); insert into t values (42); select x from t" | grep -q 42

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - run: sha256sum * > SHA256SUMS && cat SHA256SUMS
        working-directory: dist
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
